[tools]
rust = { version = "1.99.0", targets = "wasm32-unknown-unknown", components = "clippy,rustfmt" }
"github:trunk-rs/trunk" = "0.21.14"
# For the tile and route pipelines in tools/ (the dev servers run in
# compose.yaml, which installs its own).
python = "3.13"

[env]
IMAGE = "localhost/ferry-demo:dev"
SERVER_IMAGE = "localhost/ferry-demo-server:dev"
# The 1Password reference, which `op run` resolves; a value already set (by
# `op run`, or a container's environment) is kept, so tools run through
# mise's shims see the resolved code.
WSDOT_API_KEY = "{{ get_env(name='WSDOT_API_KEY', default='op://425dp2cwyte4u6pujsglwpttbq/x3yvm7ynhpkhahlhwcvjdwqczm/access_code') }}"

[tasks.claude]
description = "Start the Claude Code container for the project."
run = """
podman run -it --rm \
  --hostname claude-code \
  --device /dev/dri \
  --device /dev/fuse \
  --security-opt label=type:container_engine_t \
  --cap-add=SYS_ADMIN \
  -v "${PWD}:/workspace:z" \
  -v "claude-home:/root/.claude" \
  -v "claude-mise:/root/.local/share/mise" \
  -v "claude-cargo:/root/.cargo/registry" \
  -v "claude-cache:/root/.cache" \
  -v "claude-podman:/var/lib/containers" \
  -w /workspace \
  -e TERM -e COLORTERM \
  --tz local \
  --group-add keep-groups \
  ghcr.io/salishseawolf/claude-oci:web-gpu
""""

[tasks.dev]
description = "Start the dev environment (compose.yaml) on http://localhost:8080, with Postgres on 5432"
# The server reads the routes file (a build output, ignored by git).
depends = ["tiles:routes"]
run = "op run -- podman compose up --build"

[tasks."dev:down"]
description = "Stop the dev environment (its volumes, the database included, are kept)"
run = "podman compose down"

[tasks."dev:psql"]
description = "Open psql on the dev database"
run = "podman compose exec db psql -U ferry ferry"

[tasks."dev:advice"]
description = "Work out the record arrival advice is drawn from (the daily job; tools/k8s/compute-advice.yaml in production)"
# The server picks up the new record within a minute.
run = "podman compose run --rm --no-deps server cargo run --locked -p ferry-server -- compute-advice"

[tasks."dev:dump"]
description = "Dump the dev database into dumps/ (pg_dump custom format), after checking it holds no trace of the WSDOT key"
# The server never stores the key (raw_polls keeps the path, not the URL),
# but a WSF answer that echoed it back would be kept, so look before
# writing a file that may be shared (tools/dev/no_key.sql). op run resolves
# the key for the check only; it reaches psql through the environment.
run = '''
set -eu
op run -- podman compose exec -T -e WSDOT_API_KEY db psql -U ferry -d ferry -qAtX -v ON_ERROR_STOP=1 < tools/dev/no_key.sql >/dev/null 2>&1 || { echo "dev:dump: stopped: the WSDOT key is in raw_polls, or the check couldn't run" >&2; exit 1; }
mkdir -p dumps
f="dumps/ferry-$(date -u +%Y%m%dT%H%MZ).dump"
podman compose exec -T db pg_dump -U ferry -d ferry -Fc -Z 6 > "$f.part"
mv "$f.part" "$f"
ls -lh "$f"
'''

[tasks."dev:offline"]
description = "Run the app with no network or WSDOT key, against a fake WSF (DUMP=dumps/… to start from a dump; see tools/dev/offline/run.sh)"
depends = ["tiles:routes"]
run = "tools/dev/offline/run.sh"

[tasks."dev:shot"]
description = "Screenshot the running app in headless Chromium: mise run dev:shot -- OUT.png [--phone] [--at LAT,LON,ALT_M] [--find TEXT]"
# Only these tasks need Node, so it isn't in [tools] (CI doesn't install it).
tools = { node = "24" }
run = "[ -d tools/dev/browser/node_modules ] || npm ci --prefix tools/dev/browser --no-audit --no-fund --silent; node tools/dev/browser/shot.js"

[tasks."dev:smoke"]
description = "Check the app end to end in headless Chromium, against dev:offline"
tools = { node = "24" }
run = "[ -d tools/dev/browser/node_modules ] || npm ci --prefix tools/dev/browser --no-audit --no-fund --silent; node tools/dev/browser/smoke.js"

[tasks.build]
description = "Release build into dist/"
run = "trunk build --release"

[tasks.check]
description = "Format check, and clippy on the wasm target and natively"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --exclude ferry-server --target wasm32-unknown-unknown -- -D warnings",
  "cargo clippy --workspace --all-targets -- -D warnings",
]

[tasks.fmt]
description = "Format the code"
run = "cargo fmt --all"

[tasks.pre-commit]
description = "Check the formatting before a commit (the git hook `mise run setup` installs)"
# Checks only, never rewrites: what's committed is what was staged. CI
# checks the same (and clippy, which is too slow for every commit).
run = '''
if ! cargo fmt --all --check; then
  echo "Formatting is off: run 'mise run fmt', then commit again." >&2
  exit 1
fi
'''

[tasks.setup]
description = "Set up a fresh clone: install the git pre-commit hook (formatting check)"
run = "mise generate git-pre-commit --write"

[tasks."container:build"]
description = "Build the release images: the app's (nginx) and the server's (TILES_IMAGE=… for local tiles: see tiles:image)"
# The server image carries the routes file, a build output (ignored by
# git); making it reuses the cached OpenStreetMap download. The app's
# image takes its tiles from the published tiles image the Containerfile
# pins, or TILES_IMAGE if set.
depends = ["tiles:routes"]
run = [
  "podman build --target web ${TILES_IMAGE:+--build-arg TILES=$TILES_IMAGE} -t $IMAGE -f Containerfile .",
  "podman build --target server -t $SERVER_IMAGE -f Containerfile .",
]

[tasks."container:run"]
description = "Run the release images with Postgres (compose.release.yaml) on http://localhost:8080"
run = "op run -- podman compose -f compose.release.yaml up"

[tasks."container:down"]
description = "Stop the release images (their database volume is kept)"
run = "podman compose -f compose.release.yaml down"

[tasks."tiles:elevation"]
description = "Build the elevation tiles into tiles/ (downloads to data/; ZOOMS=0,1,... for some levels)"
run = """
mkdir -p tiles data
podman run --rm \
  -e ZOOMS \
  -v ./tools/tiles:/tools:ro,z \
  -v ./data:/cache:z \
  -v ./tiles:/out:z \
  ghcr.io/osgeo/gdal:ubuntu-small-3.11.4@sha256:1e450ff0e12140dc72c2ad6ff3978c96ea910187ec3ec4281a814f470606412c \
  python3 /tools/elevation.py
"""

[tasks."tiles:image"]
description = "Build the terrain tiles image from tiles/, locally (TILES_IMAGE=localhost/ferry-demo-tiles:dev mise run container:build uses it)"
run = "podman build -f tiles.Containerfile -t localhost/ferry-demo-tiles:dev tiles"

[tasks."tiles:publish"]
description = "Publish the terrain tiles image to ghcr.io and pin it in the Containerfile (needs `podman login ghcr.io`)"
# Tiles change rarely: after `tiles:elevation`. Commit the Containerfile
# change this makes; CI builds the app's image with the pinned tiles.
run = '''
set -eu
repo=ghcr.io/salishseawolf/ferry-demo-tiles
tag="$repo:$(date -u +%Y-%m-%d)"
podman build -f tiles.Containerfile -t "$tag" tiles
digest_file=$(mktemp)
podman push --digestfile "$digest_file" "$tag"
pinned="$repo@$(cat "$digest_file")"
rm -f "$digest_file"
sed -i "s|^ARG TILES=.*|ARG TILES=$pinned|" Containerfile
echo "Published $tag"
echo "Containerfile now pins $pinned: commit it."
'''

[tasks."tiles:routes"]
description = "Fit WSF ferry routes from OpenStreetMap into tiles/routes/ (REFRESH=1 to fetch again)"
run = "python3 tools/routes/osm_routes.py"

[tasks.test]
description = "Run native tests across the workspace (with DATABASE_URL set, the database ones too)"
# Not the doc tests: those fail to find h3o (a known flake), and there are
# none worth running. CI runs this.
run = "cargo test --workspace --lib --bins --tests"
