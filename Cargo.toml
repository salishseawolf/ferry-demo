[workspace]
members = ["crates/model", "crates/server"]

# Versions shared by the app and the crates under crates/.
[workspace.dependencies]
glam = "0.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[package]
name = "ferry-demo"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
console_error_panic_hook = "0.1.7"
console_log = "1.1"
ferry-model = { path = "crates/model" }
glam = { workspace = true, features = ["bytemuck"] }
h3o = "0.11"
js-sys = "0.3.106"
log = "0.4"
png = "0.18"
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
  "Clipboard",
  "Document",
  "DomTokenList",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "Headers",
  "HtmlCanvasElement",
  "HtmlCollection",
  "HtmlInputElement",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "Node",
  "NodeList",
  "MouseEvent",
  "Navigator",
  "Performance",
  "PointerEvent",
  "Response",
  "WheelEvent",
  "Window",
] }
wgpu = { version = "30.0", default-features = false, features = ["webgpu", "wgsl"] }

[profile.release]
opt-level = "s"
lto = true

[dev-dependencies]
naga = { version = "30.0", features = ["wgsl-in"] }

# Building the grid is heavy arithmetic; unoptimized builds make `mise run dev`
# and the tests several times slower.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
