# What a cluster's values look like, and what `mise run chart:lint` and CI
# render the chart with.
host: ferries.example.org
wsdot:
  itemPath: vaults/example-vault/items/wsdot-traveler-api
postgres:
  storage:
    storageClass: example-storage
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: example-object-store
backup:
  storage:
    storageClass: example-storage
ingress:
  tls:
    certResolver: example-resolver
  middlewares:
    - name: example-headers
      namespace: traefik
