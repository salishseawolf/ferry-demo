# What the cluster sets in its Argo CD Application. `host` and
# `wsdot.itemPath` have no defaults; the rest are the defaults the app was
# sized for.

# The app's address, for the IngressRoute.
host: ""

images:
  server:
    repository: ghcr.io/salishseawolf/ferry-demo-server
    # Empty: the chart's appVersion, the commit CI built the chart from.
    tag: ""
  web:
    repository: ghcr.io/salishseawolf/ferry-demo
    tag: ""
  pullPolicy: IfNotPresent

server:
  # 1, or 0 to stop recording (as a rebuild needs: see the chart's README).
  # Never more: each server polls WSF and records what it sees.
  replicas: 1
  logLevel: info
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

web:
  replicas: 1
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }

# The WSDOT Traveler API access code, from 1Password (the 1Password
# Operator makes a Secret of the item).
wsdot:
  # vaults/<vault>/items/<item>
  itemPath: ""
  # The item's field holding the code.
  field: access_code

# The database, a CloudNativePG Cluster (the operator must be installed).
postgres:
  instances: 1
  # Postgres 18.6 like the dev environment, so a dev:dump restores as is.
  # The standard image has the system's locales, which `locale` needs.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-202610190957-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
  # As in the dev environment, so text sorts the same.
  locale: en_US.UTF-8
  storage:
    # raw_polls grows about 20 GB a year, vessel_positions about 6.
    size: 40Gi
    # Empty: the cluster's default.
    storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

ingress:
  entryPoints: [websecure]
  # One of the two, or neither for no TLS here.
  tls:
    certResolver: ""
    secretName: ""
  # Traefik middlewares, as {name, namespace}.
  middlewares: []

# The daily job behind arrival advice (`ferry-server compute-advice`):
# after WSF's trip day starts at 3 AM Pacific, before the first sailings
# people plan for. A failed run leaves the last record in use, a day staler.
advice:
  schedule: "15 3 * * *"

# A nightly pg_dump of the database, in the format `mise run dev:dump`
# writes, so `DUMP=` can start the offline app from one. Everything else
# derives from raw_polls, which nothing else can bring back.
backup:
  enabled: true
  schedule: "30 4 * * *"
  # Dumps kept, newest first.
  keep: 7
  storage:
    size: 50Gi
    storageClass: ""
