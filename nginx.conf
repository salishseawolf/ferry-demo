# A template: the image's entrypoint fills in ${FERRY_API} (the server's
# host:port) from the environment at startup (envsubst, limited to FERRY_
# variables by NGINX_ENVSUBST_FILTER in the Containerfile, so nginx's own
# $variables are left alone).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the .gz files precompressed in the build stage.
    gzip_static on;
    gzip_vary on;

    # Trunk adds a content hash to asset names, so they never change.
    location ~ "-[0-9a-f]{16}(_bg)?\.(js|wasm)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Terrain tiles change only when rebuilt; a day saves revalidating each
    # of the hundreds a view loads.
    location /tiles/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # The app's API, from the server (crates/server), which sets its own
    # caching and compresses its answers. Not cached here: nginx doesn't
    # send Age for what it serves from cache, and clients time their next
    # request from max-age less Age (aligned polling), so a cached copy
    # would make them late. The server serves each document ready-made, so
    # there's little to save.
    location /api/v1/ {
        proxy_pass http://${FERRY_API};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # Everything else, index.html included, is revalidated on each load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
